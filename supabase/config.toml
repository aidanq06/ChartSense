# Supabase Configuration for ChartSense
# This file configures all aspects of your Supabase project

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://localhost:54321"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"
image_transformation = { enabled = true }

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://your-app-domain.com"]
jwt_expiry = 3600

# Email authentication
[auth.email]
enable_signup = true
enable_confirmations = false

# Social authentication providers
[auth.external.apple]
enabled = true
client_id = "env(APPLE_CLIENT_ID)"
secret = "env(APPLE_CLIENT_SECRET)"
# Additional Apple-specific settings will be configured in dashboard

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
# Additional Google-specific settings will be configured in dashboard

# Edge Functions configuration
[functions."ingest-quotes"]
verify_jwt = false

[functions."ingest-candles"]
verify_jwt = false

# Analytics and monitoring
[analytics]
enabled = false

# Experimental features (none configured)